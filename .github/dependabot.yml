version: 2
updates:
  # Go modules and the server's base images: version updates, so a pinned
  # toolchain can't drift past end of support unnoticed again.
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Grouped so wrangler and @cloudflare/workers-types move together; bumped
  # apart, wrangler's peer range breaks `npm ci`.
  - package-ecosystem: npm
    directory: /deploy/api
    schedule:
      interval: weekly
    groups:
      api-worker:
        patterns: ["*"]

  # Expo pins its own dependency set per SDK, so routine version bumps are
  # off (limit 0) and the app only gets security updates. SDK upgrades go
  # through `npx expo install --fix`.
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
