# Deploys the exact main commit from a successful CI push run.

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            deploy/api/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --prefix app
          npm ci --prefix deploy/api
      - name: Verify generated API Worker bindings
        run: npm --prefix deploy/api run types:check
      - name: Deploy API Worker and container
        working-directory: deploy/api
        # wrangler.jsonc marks these as required secrets, and `wrangler deploy`
        # inherits their values from the live Worker rather than reading the
        # environment. Provision them from the GitHub secrets via --secrets-file
        # so a rotated value (or a newly added secret) actually reaches the
        # Worker instead of failing the deploy on a missing inherited secret.
        run: |
          umask 077
          secrets_file="$(mktemp "${RUNNER_TEMP:-/tmp}/wrangler-secrets.XXXXXX.json")"
          trap 'rm -f "$secrets_file"' EXIT
          node -e '
            const fs = require("fs");
            const names = ["DATABASE_URL", "JWT_SECRET", "UPLOAD_SIGNING_SECRET", "INTERNAL_TASK_SECRET"];
            // Optional: absent means the feature stays off, not that the
            // deploy is broken. CLOUDFLARE_AI_TOKEN gates Llama Guard text
            // moderation; without it the API accepts text unscreened.
            // MAPILLARY_TOKEN gates the Mapillary photo source in the
            // enricher; without it courts still get Wikimedia Commons photos.
            const optional = ["CLOUDFLARE_AI_TOKEN", "MAPILLARY_TOKEN"];
            const out = {};
            for (const name of names) {
              const value = process.env[name];
              if (!value) {
                console.error(`missing required secret: ${name}`);
                process.exit(1);
              }
              out[name] = value;
            }
            for (const name of optional) {
              if (process.env[name]) out[name] = process.env[name];
              else console.error(`optional secret not set, feature disabled: ${name}`);
            }
            fs.writeFileSync(process.argv[1], JSON.stringify(out));
          ' "$secrets_file"
          npx wrangler deploy --secrets-file "$secrets_file" --var "DEPLOY_COMMIT:${DEPLOY_COMMIT}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          UPLOAD_SIGNING_SECRET: ${{ secrets.UPLOAD_SIGNING_SECRET }}
          INTERNAL_TASK_SECRET: ${{ secrets.INTERNAL_TASK_SECRET }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
          DEPLOY_COMMIT: ${{ github.event.workflow_run.head_sha }}
      - name: Wait for container version to match deployed commit
        env:
          API_ORIGIN: ${{ secrets.EXPO_PUBLIC_API_URL }}
          INTERNAL_TASK_SECRET: ${{ secrets.INTERNAL_TASK_SECRET }}
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          test -n "$API_ORIGIN"
          for i in $(seq 1 60); do
            got="$(curl --fail --silent --show-error --max-time 10 \
              -H "X-Internal-Task: ${INTERNAL_TASK_SECRET}" \
              "${API_ORIGIN%/}/api/v1/internal/version" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{console.log(JSON.parse(d).commit)}catch{}})')" || true
            if [ "$got" = "$EXPECTED_COMMIT" ]; then
              echo "Container is running commit $got"
              exit 0
            fi
            echo "Waiting for container rollout... ($i)"
            sleep 10
          done
          echo "Container did not reach expected commit $EXPECTED_COMMIT"
          exit 1
      - name: Smoke API health and upload authorization
        env:
          API_ORIGIN: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: |
          test -n "$API_ORIGIN"
          case "$API_ORIGIN" in https://*) ;; *) exit 1 ;; esac
          test "$(node -e 'process.stdout.write(new URL(process.env.API_ORIGIN).origin)')" = "${API_ORIGIN%/}"
          curl --fail --silent --show-error --retry 36 --retry-all-errors --retry-delay 10 --retry-max-time 420 --connect-timeout 10 --max-time 20 "${API_ORIGIN%/}/healthz"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --request PUT "${API_ORIGIN%/}/photos/upload/courts/123e4567-e89b-42d3-a456-426614174000/123e4567-e89b-42d3-a456-426614174001.jpg")"
          test "$status" = "403"
      - name: Build web app for its canonical origin
        env:
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          # Store links for the web "get the app" banner; empty (bannerless
          # link) until the Play/App Store listings exist.
          EXPO_PUBLIC_ANDROID_STORE_URL: ${{ vars.ANDROID_STORE_URL }}
          EXPO_PUBLIC_IOS_STORE_URL: ${{ vars.IOS_STORE_URL }}
          # Crash reporting (same DSN as the native builds in app/eas.json;
          # DSNs are client-side values, safe in the repo).
          EXPO_PUBLIC_SENTRY_DSN: "https://38788832af3499c169cc616fada49a7b@o4511762347786240.ingest.us.sentry.io/4511762353684480"
        run: |
          test -n "$WEB_ORIGIN"
          case "$WEB_ORIGIN" in https://*) ;; *) exit 1 ;; esac
          test "$(node -e 'process.stdout.write(new URL(process.env.WEB_ORIGIN).origin)')" = "${WEB_ORIGIN%/}"
          EXPO_PUBLIC_API_URL="${WEB_ORIGIN%/}" EXPO_PUBLIC_WEB_URL="${WEB_ORIGIN%/}" npm --prefix app run export:web
      - name: Deploy web Worker
        run: deploy/api/node_modules/.bin/wrangler deploy --cwd app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Smoke web app and security headers
        env:
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
        # The origin may sit behind Cloudflare Access (private beta): accept
        # either the worker's security headers or an Access login redirect.
        run: |
          curl --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --retry-max-time 120 --connect-timeout 10 --max-time 20 --dump-header "$RUNNER_TEMP/web-headers" --output /dev/null "${WEB_ORIGIN%/}/"
          if grep -qi '^content-security-policy:' "$RUNNER_TEMP/web-headers"; then
            grep -qi '^x-content-type-options: nosniff' "$RUNNER_TEMP/web-headers"
          elif grep -qi '^location: https://[a-z0-9.-]*\.cloudflareaccess\.com/' "$RUNNER_TEMP/web-headers"; then
            echo "Web origin is behind Cloudflare Access; header assertions run post-login."
          else
            echo "Web origin returned neither security headers nor an Access redirect:"
            cat "$RUNNER_TEMP/web-headers"
            exit 1
          fi
      - name: Smoke MapLibre worker
        env:
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
        # MapLibre 6 loads its tile worker as a separate module. If it is not
        # served, the SPA fallback returns index.html in its place and the map
        # renders no tiles while every other check passes — so assert the
        # worker comes back as JavaScript. Same Access allowance as above.
        run: |
          version="$(node -p "require('./app/node_modules/maplibre-gl/package.json').version")"
          curl --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 20 --dump-header "$RUNNER_TEMP/worker-headers" --output /dev/null "${WEB_ORIGIN%/}/maplibre/${version}/maplibre-gl-worker.mjs"
          if grep -qi '^location: https://[a-z0-9.-]*\.cloudflareaccess\.com/' "$RUNNER_TEMP/worker-headers"; then
            echo "Web origin is behind Cloudflare Access; worker check skipped."
          elif ! grep -qiE '^content-type: (text|application)/javascript' "$RUNNER_TEMP/worker-headers"; then
            echo "MapLibre ${version} worker was not served as JavaScript:"
            cat "$RUNNER_TEMP/worker-headers"
            exit 1
          fi
