name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: pullup
          POSTGRES_PASSWORD: pullup
          POSTGRES_DB: pullup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pullup"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go vet ./...
      - name: go test (incl. PostGIS integration)
        run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://pullup:pullup@localhost:5432/pullup_test?sslmode=disable

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
