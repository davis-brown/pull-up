name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: pullup
          POSTGRES_PASSWORD: pullup
          POSTGRES_DB: pullup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pullup"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - name: go test (incl. PostGIS integration)
        run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://pullup:pullup@localhost:5432/pullup_test?sslmode=disable

  app-workers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            deploy/api/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --prefix app
          npm ci --prefix deploy/api
      - name: Check app and web Worker types
        run: npm --prefix app run typecheck
      - name: Test app
        run: npm --prefix app test -- --runInBand
      - name: Export web app
        run: npm --prefix app exec -- expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: https://web.invalid
          EXPO_PUBLIC_WEB_URL: https://web.invalid
      - name: Check generated API Worker bindings
        run: npm --prefix deploy/api run types:check
      - name: Check API Worker types
        run: npm --prefix deploy/api run typecheck
      - name: Test API Worker
        run: npm --prefix deploy/api test
      - name: Dry-run API Worker and container build
        run: npm --prefix deploy/api run dry-run
      - name: Dry-run web Worker
        run: deploy/api/node_modules/.bin/wrangler deploy --dry-run --cwd app --outdir .wrangler/dry-run
