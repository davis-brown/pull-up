services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: pullup
      POSTGRES_PASSWORD: pullup
      POSTGRES_DB: pullup
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pullup"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
